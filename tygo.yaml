packages:
  - path: "github.com/bborbe/attention-controller/pkg"
    output_path: "frontend/src/types.ts"
    type_mappings:
      time.Time: "string"
      github.com/bborbe/time.DateTime: "string"
      error: "string"
    # Only the board's data model — Item and the value types it is built from.
    # The whole pkg carries store internals, metrics consts and Go builtins that
    # tygo cannot map, so the frontend takes the schema files, not the package.
    include_files:
      - attention-item.go
      - producer-kind.go
      - provenance-class.go
      - risk.go
      - rating.go
      - decision.go
      - close-reason.go
      - answer-mechanism.go
      - answer-kind.go
      - answer-option.go
      - answer-cardinality.go
      - answer.go
      - answers.go
      - answerer.go
      - answered-client.go
      - answered-signal.go
      - question.go
      - attention-state.go
    frontmatter: |
      // Code generated by tygo from pkg. DO NOT EDIT.
